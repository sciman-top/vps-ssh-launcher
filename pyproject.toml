[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-ssh-launcher"
version = "1.1.1"
requires-python = ">=3.11"
dependencies = ["paramiko>=5.0.0,<6.0.0"]

[project.optional-dependencies]
installer = ["pexpect>=4.9.0"]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.13.0",
    "pexpect>=4.9.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "types-pexpect>=4.9.0",
]

[tool.setuptools]
py-modules = ["ssh_tool", "auto_install"]
packages = ["vps_ssh_launcher"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Enumerate the suite explicitly: the repo root also holds the live
# sciman-v2ray-agent upstream checkout whose test tree must not be collected.
testpaths = [
    "test_ssh_tool.py",
    "test_auto_install.py",
    "test_scripts.py",
    "test_integration_real_ssh.py",
]
python_files = ["test_*.py"]
