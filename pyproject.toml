[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-ssh-launcher"
# Single source of truth: vps_ssh_launcher/contracts.py __version__.
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["paramiko>=5.0.0,<6.0.0"]

[project.scripts]
vps-maint = "vps_ssh_launcher.maintenance_cli:main"

[project.optional-dependencies]
installer = ["pexpect>=4.9.0"]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.13.0",
    "pexpect>=4.9.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "types-pexpect>=4.9.0",
]

[tool.setuptools]
py-modules = ["ssh_tool", "auto_install"]
packages = ["vps_ssh_launcher", "vps_ssh_launcher.maintenance"]

[tool.setuptools.dynamic]
version = { attr = "vps_ssh_launcher.contracts.__version__" }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Test files import their support modules (cpa_catalog_expectations,
# script_validation_support) as top-level modules from tests/.
mypy_path = ["tests"]

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true

# PyYAML ships no inline stubs and types-PyYAML is not a dev dependency; the
# remote CPA scripts and their tests only use safe_load/safe_dump.
[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
# Collect only the tests/ tree: the repo root also holds the live
# sciman-v2ray-agent upstream checkout whose test tree must not be collected.
testpaths = ["tests"]
python_files = ["test_*.py"]
# --strict-markers: a typo'd marker would otherwise be silently ignored.
# -ra: always list skipped tests with their reasons, so a host without bash or
# pwsh cannot quietly shrink the behavioural suite while the gate stays green.
addopts = ["--strict-markers", "-ra"]
# A hanging test used to be silent (the 2026-10-03 gate hang ran 58 minutes
# before anyone saw a stack). Dump the blocking traceback instead.
faulthandler_timeout = 120
