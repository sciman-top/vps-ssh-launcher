[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-ssh-launcher"
version = "1.1.1"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.4.0"]

[project.optional-dependencies]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.13.0",
    "pexpect>=4.9.0",
    "pip-audit>=2.7.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "types-pexpect>=4.9.0",
    "vulture>=2.14",
]

[tool.setuptools]
py-modules = ["ssh_tool", "auto_install"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
