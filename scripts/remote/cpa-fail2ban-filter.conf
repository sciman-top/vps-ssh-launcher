[Definition]
# Only CPA client authentication failures; provider errors are not bans.
#
# The match must not be anchored to end-of-line. cpa_safe appends fields to the
# end of the record whenever one becomes observable (route= on 2026-09-15,
# upstream_header_time= on 2026-10-28), and both landed between auth_status and
# the old \s*$ anchor. Measured on bwg 2026-11-09: fail2ban-regex matched 0 of
# 1702 lines, so the jail could never ban a credential-stuffing source while the
# doctor's grep-based check still reported fail2ban-contract=OK. Terminate on
# whitespace-or-end instead, so an appended field cannot silently disarm it.
# route= stays optional: the 443 fallback lane (cpa_safe443) and the pre-route
# legacy shape both omit or rename it.
failregex = ^<HOST> method=[A-Z]+ (?:route=\S+ )?status=(401|403) .* auth_status=(401|403)(?:\s|$)
ignoreregex =
