# /etc/systemd/system/docker.service.d/20-cpa-oom-isolation.conf
#
# Keep the CPA container's 512 MiB mem_limit from turning into an OOM of the
# admission gate (2026-11-08 review).
#
# Measured on bwg that day: dockerd's service cgroup held both the CPA
# container (container accounting stays in dockerd's cgroup when no slice is
# configured) and the docker-proxy listener, and its memory accounting covers
# the whole host. A container that reaches its own mem_limit therefore does not
# pay for it alone: the pressure lands on dockerd's cgroup. On 2026-11-08
# cpa-admission sat at 724 MiB RSS (832 MiB peak) -- it owns every lane's
# durable breaker state -- while the CPA Go heap live set was 139 MiB with a
# cumulative allocation of 67 GB, so a single large translation burst was the
# largest process in that cgroup.
#
# Delegate=yes plus a Slice puts docker in a dedicated child cgroup of
# docker.service's unit, created by systemd with its own controllers. The
# intent is that container memory is accounted under the CPA container's own
# cgroup, so a limit hit names the container that caused it instead of landing
# in a shared bucket with the gate.
#
# Prerequisites verified 2026-11-08: docker already runs with Delegate=yes,
# CgroupVersion=2 and the systemd cgroup driver, and the root cgroup delegates
# memory (cgroup.subtree_control = cpuset cpu io memory hugetlb pids rdma misc).
#
# Deploy (low-traffic window; dockerd must be restarted to change its unit):
#   install -m 0644 20-cpa-oom-isolation.conf \
#     /etc/systemd/system/docker.service.d/20-cpa-oom-isolation.conf
#   systemctl daemon-reload
#   systemctl restart docker
#   # proof, not assumption:
#   docker inspect cli-proxy-api --format '{{.HostConfig.CgroupParent}}'
#   cat /sys/fs/cgroup/docker.slice/$(systemctl show -p MainPID --value docker).slice/docker-*.scope/cgroup.controllers 2>/dev/null
#   docker start cli-proxy-api   # containers inherit the parent only when created
#
# Rollback: rm the drop-in; systemctl daemon-reload; systemctl restart docker.
[Service]
Slice=docker.slice
Delegate=yes
MemoryAccounting=yes
CPUAccounting=yes
