name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/change-evidence/**"
      - "docs/runbooks/**"
      - "README.md"
      - "README.en.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".workbuddy-ai/**"
      - "outputs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/change-evidence/**"
      - "docs/runbooks/**"
      - "README.md"
      - "README.en.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".workbuddy-ai/**"
      - "outputs/**"
      - ".gitignore"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run static gates and dependency audit
        shell: pwsh
        run: ./scripts/run_gates.ps1 -Profile Full -FullScope Static -RunDependencyAudit

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
            gate: full
          - os: windows-latest
            python-version: "3.13"
            gate: smoke
          - os: ubuntu-latest
            python-version: "3.11"
            gate: full
          - os: ubuntu-latest
            python-version: "3.13"
            gate: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run full runtime gates
        if: matrix.gate == 'full'
        shell: pwsh
        run: ./scripts/run_gates.ps1 -Profile Full -FullScope Runtime -RunParallel

      - name: Run Python compatibility smoke
        if: matrix.gate == 'smoke'
        shell: pwsh
        run: >-
          ./scripts/run_gates.ps1 -Profile Focused
          -FocusPath
          tests/test_config.py,tests/test_connection.py,tests/test_execution.py,tests/test_ssh_tool.py
