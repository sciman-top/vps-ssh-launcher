name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/change-evidence/**"
      - "docs/runbooks/**"
      - "README.md"
      - "README.en.md"
      - "AGENTS.md"
      - ".agents/rules/**"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".workbuddy-ai/**"
      - "outputs/**"
  pull_request:
    paths-ignore:
      - "docs/change-evidence/**"
      - "docs/runbooks/**"
      - "README.md"
      - "README.en.md"
      - "AGENTS.md"
      - ".agents/rules/**"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".workbuddy-ai/**"
      - "outputs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run static gates and dependency audit
        shell: pwsh
        run: ./scripts/run_gates.ps1 -Profile Full -FullScope Static -RunDependencyAudit

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run runtime gates
        shell: pwsh
        run: ./scripts/run_gates.ps1 -Profile Full -FullScope Runtime
