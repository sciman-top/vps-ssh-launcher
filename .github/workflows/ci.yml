name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: Gates (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
            dependency-audit: true
          - os: ubuntu-latest
            python-version: "3.13"
            dependency-audit: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run repository gates
        shell: pwsh
        run: |
          $gateArgs = @()
          if ("${{ matrix.dependency-audit }}" -eq "true") {
            $gateArgs += "-RunDependencyAudit"
          }
          ./scripts/run_gates.ps1 @gateArgs
