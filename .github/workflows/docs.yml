name: Documentation checks

on:
  push:
    branches:
      - main
    # HG03_Final_v4/** was removed: the kit left the repository on 2026-11-14,
    # so the glob could never match. docs/** now covers runbooks, audits and
    # every future docs subtree except the historical receipts (which
    # check_docs.py deliberately excludes).
    paths:
      - "README.md"
      - "README.en.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "scripts/check_docs.py"
  pull_request:
    paths:
      - "README.md"
      - "README.en.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "scripts/check_docs.py"

permissions:
  contents: read

jobs:
  diff-check:
    name: Documentation diff check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA...$HEAD_SHA"
          else
            git diff --check HEAD^
          fi

      - name: Validate current documentation paths
        run: python scripts/check_docs.py
